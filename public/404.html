<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
        // Encode the full path into a query string and redirect to the root
        const path = window.location.pathname;
        window.location.replace(
            '/?redirect=' + encodeURIComponent(path)
        );
    </script>
  </head>
  <body></body>
</html>
